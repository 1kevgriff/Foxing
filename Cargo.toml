[package]
name = "foxing"
version = "0.1.2"
edition = "2021"
description = "Minimal Win32 plain-text editor"

[dependencies]
# SIMD byte search for the large-file buffer (newline index, find).
memchr = "2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dev-dependencies.windows-sys]
version = "0.61"
features = ["Win32_System_Threading"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
